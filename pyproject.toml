[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "film-lab"
version = "0.1.0"
description = "Reproducible computational filmmaking experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python-headless>=4.8", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]
# Third-party model inference is intentionally kept in separate environments.

[project.scripts]
film-lab = "film_lab.spatial.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
